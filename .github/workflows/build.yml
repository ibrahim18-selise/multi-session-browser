name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 10 and 11
            os: windows-latest
            kind: win
          - name: Windows 7
            os: windows-latest
            kind: win7
          - name: macOS
            os: macos-latest
            kind: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Read version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build for Windows 10 and 11
        if: matrix.kind == 'win'
        run: |
          npx electron-builder --win --publish never
          cp "dist/Multi-Session-Browser-Setup-$VERSION.exe" dist/Multi-Session-Browser-Setup-win-x64.exe
          cp "dist/Multi-Session-Browser-$VERSION-portable.exe" dist/Multi-Session-Browser-portable-win-x64.exe

      - name: Build for Windows 7 (32-bit and 64-bit)
        if: matrix.kind == 'win7'
        run: |
          npm install --no-save --no-audit --no-fund electron@22.3.27
          npx electron-builder --win nsis --x64 --ia32 --publish never \
            -c.electronVersion=22.3.27 \
            -c.nsis.artifactName='Multi-Session-Browser-Setup-${version}-win7.${ext}'
          cp "dist/Multi-Session-Browser-Setup-$VERSION-win7.exe" dist/Multi-Session-Browser-Setup-win7.exe

      - name: Build for macOS
        if: matrix.kind == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac --publish never
          cp "dist/Multi-Session-Browser-$VERSION-mac-arm64.dmg" dist/Multi-Session-Browser-mac-arm64.dmg
          cp "dist/Multi-Session-Browser-$VERSION-mac-x64.dmg" dist/Multi-Session-Browser-mac-x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.kind }}
          path: |
            dist/*.exe
            dist/*.dmg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
